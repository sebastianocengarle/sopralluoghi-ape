<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09405C">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sopralluoghi APE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root { --indigo:#09405C; --saffron:#EFC000; --ink:#1f2421; --muted:#5b615c; --ground:#f4f3ef; --line:#d9d6cc; --tint:#e4ebef; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Century Gothic","Segoe UI",system-ui,sans-serif; color:var(--ink); background:var(--ground); min-height:100vh; }
  header { background:var(--indigo); color:#fff; padding:calc(env(safe-area-inset-top) + 20px) 20px 18px; }
  header .sub { font-size:13px; opacity:.85; }
  header h1 { font-size:24px; margin:4px 0 0; }
  main { padding:16px; display:flex; flex-direction:column; gap:12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .card .addr { font-weight:600; }
  .card .meta { font-size:13px; color:var(--muted); margin-top:4px; }
  .badge { font-size:12px; background:var(--tint); color:var(--indigo); border-radius:999px; padding:3px 10px; white-space:nowrap; }
  .empty { text-align:center; color:var(--muted); padding:32px 8px; font-size:15px; }
  footer { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(env(safe-area-inset-bottom) + 16px); background:var(--ground); border-top:1px solid var(--line); }
  button.primary { width:100%; min-height:52px; border:0; border-radius:26px; background:var(--indigo); color:#fff; font:inherit; font-size:16px; font-weight:600; cursor:pointer; }
  button.primary:disabled { opacity:.5; }
  .spacer { height:96px; }
  .note { font-size:12px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<header>
  <div class="sub">Attestati di prestazione energetica</div>
  <h1>Sopralluoghi</h1>
</header>

<main id="list">
  <div class="empty" id="empty">Nessun sopralluogo ancora.<br>Tocca “Nuovo sopralluogo” per iniziare.</div>
</main>
<div class="spacer"></div>

<footer>
  <button class="primary" id="new" type="button">+ Nuovo sopralluogo</button>
  <div class="note" id="status">Versione di prova · dati salvati sul telefono</div>
</footer>

<script>
  // Versione di prova: l'elenco è letto da localStorage (in fase di sviluppo).
  const KEY = 'sopralluoghi_v0';
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; }
  }
  function save(items) {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) { /* archiviazione non disponibile */ }
  }
  function render() {
    const items = load();
    const list = document.getElementById('list');
    list.querySelectorAll('.card').forEach(n => n.remove());
    document.getElementById('empty').style.display = items.length ? 'none' : 'block';
    items.forEach(it => {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = '<div class="top"><div class="addr"></div><span class="badge">Bozza</span></div>' +
                      '<div class="meta"></div>';
      div.querySelector('.addr').textContent = it.indirizzo || '[Indirizzo immobile]';
      div.querySelector('.meta').textContent = 'Creato il ' + new Date(it.creato).toLocaleDateString('it-IT');
      list.appendChild(div);
    });
  }
  document.getElementById('new').addEventListener('click', () => {
    const indirizzo = prompt('Indirizzo dell’immobile (provvisorio):', '');
    if (indirizzo === null) return;
    const items = load();
    items.unshift({ id: Date.now(), indirizzo: indirizzo.trim(), creato: new Date().toISOString() });
    save(items);
    render();
  });
  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
