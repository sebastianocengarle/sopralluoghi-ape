<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09405C">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sopralluoghi APE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root { --indigo:#09405C; --saffron:#EFC000; --ink:#1f2421; --muted:#5b615c; --ground:#f4f3ef; --line:#d9d6cc; --tint:#e4ebef; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Century Gothic","Segoe UI",system-ui,sans-serif; color:var(--ink); background:var(--ground); min-height:100vh; }
  header.top { position:sticky; top:0; z-index:5; background:var(--indigo); color:#fff; padding:calc(env(safe-area-inset-top) + 14px) 16px 14px; display:flex; align-items:center; gap:12px; }
  header.top .sub { font-size:12px; opacity:.85; }
  header.top h1 { font-size:20px; margin:2px 0 0; }
  header.top .back { background:none; border:0; color:#fff; font:inherit; font-size:15px; padding:6px 8px 6px 0; cursor:pointer; }
  main { padding:16px; display:flex; flex-direction:column; gap:12px; padding-bottom:150px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card.list { cursor:pointer; }
  .card .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .card .addr { font-weight:600; }
  .card .meta { font-size:13px; color:var(--muted); margin-top:4px; }
  .badge { font-size:12px; background:var(--tint); color:var(--indigo); border-radius:999px; padding:3px 10px; white-space:nowrap; }
  .empty { text-align:center; color:var(--muted); padding:32px 8px; font-size:15px; }
  footer.bar { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(env(safe-area-inset-bottom) + 16px); background:var(--ground); border-top:1px solid var(--line); }
  button.primary { width:100%; min-height:52px; border:0; border-radius:26px; background:var(--indigo); color:#fff; font:inherit; font-size:16px; font-weight:600; cursor:pointer; }
  button.secondary { min-height:48px; border:1px solid var(--line); border-radius:24px; background:#fff; color:var(--ink); font:inherit; font-size:15px; font-weight:600; padding:0 18px; cursor:pointer; }
  button.link { background:none; border:0; color:var(--indigo); font:inherit; font-size:14px; font-weight:600; padding:6px 0; cursor:pointer; text-align:left; }
  button.danger { background:none; border:0; color:#8a4b08; font:inherit; font-size:13px; padding:4px 0; cursor:pointer; }
  .tabs { display:flex; gap:6px; overflow-x:auto; padding:10px 16px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:72px; z-index:4; }
  .tabs button { flex:0 0 auto; border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 14px; font:inherit; font-size:13px; color:var(--ink); cursor:pointer; }
  .tabs button.on { background:var(--indigo); border-color:var(--indigo); color:#fff; }
  .sec-title { font-size:12px; color:var(--muted); margin:6px 0 -2px; text-transform:uppercase; letter-spacing:.04em; }
  .unit { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .unit .head { display:flex; justify-content:space-between; align-items:center; }
  .unit .head b { font-size:14px; }
  label.f { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  input.t, select.t, textarea.t { height:46px; border:1px solid #cfcbbf; border-radius:8px; background:#fff; padding:0 12px; font:inherit; font-size:16px; color:var(--ink); width:100%; }
  textarea.t { height:auto; min-height:64px; padding:10px 12px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips label { font-size:14px; color:var(--ink); border:1px solid #cfcbbf; border-radius:999px; padding:8px 14px; background:#fff; display:inline-flex; align-items:center; gap:6px; cursor:pointer; }
  .chips input { margin:0; width:16px; height:16px; accent-color:var(--indigo); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .thumb { width:100%; height:130px; border:1px dashed var(--indigo); border-radius:10px; background:#f7f9fa; display:flex; align-items:center; justify-content:center; color:var(--indigo); font-size:14px; overflow:hidden; position:relative; cursor:pointer; }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .thumb input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
  .sigbox { position:relative; background:#fff; border:1.5px dashed var(--indigo); border-radius:10px; height:200px; touch-action:none; }
  .sigbox canvas { width:100%; height:100%; display:block; border-radius:10px; }
  .sigbox .hint { position:absolute; left:12px; bottom:10px; font-size:12px; color:var(--muted); pointer-events:none; }
  .ok { font-size:13px; color:var(--indigo); min-height:18px; }
  .note { font-size:12px; color:var(--muted); text-align:center; }

  /* Planimetria */
  .plan { position:relative; background:#fff; border:1px solid var(--line); border-radius:10px; overflow:auto; cursor:crosshair; touch-action:none; }
  .plan-inner { position:relative; width:100%; }
  .plan img { display:block; width:100%; height:auto; user-select:none; -webkit-user-drag:none; }
  .plan .empty-plan { padding:40px 12px; text-align:center; color:var(--muted); font-size:14px; }
  .pin { position:absolute; width:28px; height:28px; margin:-14px 0 0 -14px; border-radius:50%; background:var(--indigo); color:#fff; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.35); cursor:pointer; }
  .pin.on { background:var(--saffron); color:var(--indigo); }
  .ink-svg { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; }
  .ink-draw { position:absolute; left:0; top:0; width:100%; height:100%; touch-action:none; cursor:crosshair; }
  .draw-bar { background:#fff4d6; border:1px solid var(--saffron); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:8px; font-size:13px; }
  .photos { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .photos .ph { position:relative; border-radius:8px; overflow:hidden; background:#eee; aspect-ratio:4/3; }
  .photos .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .photos .ph button { position:absolute; top:4px; right:4px; width:26px; height:26px; border-radius:50%; border:0; background:rgba(31,36,33,.75); color:#fff; font-size:15px; line-height:26px; padding:0; cursor:pointer; }
  .photo-add { position:relative; border:1px dashed var(--indigo); border-radius:8px; height:92px; display:flex; align-items:center; justify-content:center; color:var(--indigo); font-size:14px; cursor:pointer; overflow:hidden; }
  .photo-add input { position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; }

  #sheet, #modeSheet { position:fixed; inset:0; background:rgba(31,36,33,.45); display:none; align-items:flex-end; z-index:10; }
  #sheet.open, #modeSheet.open { display:flex; }
  #sheet .panel, #modeSheet .panel { background:var(--ground); width:100%; border-radius:18px 18px 0 0; padding:18px 20px calc(env(safe-area-inset-bottom) + 20px); display:flex; flex-direction:column; gap:12px; }
  #sheet h2, #modeSheet h2 { font-size:20px; margin:0; }
  #sheet .err { color:#8a4b08; font-size:13px; min-height:16px; }
  #sheet .row { display:flex; gap:10px; }
  #sheet .row > * { flex:1; }
</style>
</head>
<body>

<div id="app"></div>

<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <form class="panel" id="newForm" autocomplete="off">
    <h2 id="sheetTitle">Nuovo sopralluogo</h2>
    <label class="f">Indirizzo dell’immobile
      <input class="t" id="addr" name="addr" type="text" placeholder="Es. Via Roma 12, Torino" maxlength="120">
    </label>
    <div class="err" id="err"></div>
    <div class="row">
      <button class="secondary" id="cancel" type="button">Annulla</button>
      <button class="primary" type="submit">Crea</button>
    </div>
  </form>
</div>

<div id="modeSheet" role="dialog" aria-modal="true" aria-labelledby="modeTitle">
  <div class="panel">
    <h2 id="modeTitle">Cosa vuoi fare?</h2>
    <button class="primary" id="modeTag" type="button">Inserisci TAG FOTO</button>
    <button class="secondary" id="modeDraw" type="button">Disegna appunti</button>
    <button class="secondary" id="modeCancel" type="button">Annulla</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ================= Costanti =================
  const KEY = 'sopralluoghi_v1';
  const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const TABS = [
    { id: 'generali', label: 'Generali' },
    { id: 'involucro', label: 'Involucro' },
    { id: 'serramenti', label: 'Serramenti' },
    { id: 'impianti', label: 'Impianti' },
    { id: 'rinnovabili', label: 'Rinnovabili' },
    { id: 'planimetria', label: 'Planimetria' },
    { id: 'firma', label: 'Firma' }
  ];

  // ================= Modelli dati =================
  function blankWall() { return { descrizione: '', spessore: '', isolamento: '', spessoreIsolante: '', disperdenza: '' }; }
  function blankStruct() { return { descrizione: '', isolamento: '', spessoreIsolante: '', confine: '', confineAltro: '' }; }
  function blankWindow() { return { materiale: '', materialeAltro: '', vetro: '', vetroAltro: '', oscuranti: [] }; }
  function blankGen() { return { tipologia: '', tipologiaAltro: '', combustibile: '', combustibileAltro: '', potenza: '', anno: '' }; }
  function blankRinn() { return { tipo: '', tipoAltro: '', presente: '', anno: '', potenza: '', superficie: '' }; }

  function newVisit(indirizzo) {
    return {
      id: Date.now(),
      indirizzo: indirizzo,
      creato: new Date().toISOString(),
      generali: { nome: '', telefono: '', cf: '', foglio: '', mappale: '', sub: '', indirizzoEdificio: indirizzo,
                  piano: '', pianiAbitazione: '', pianiEdificio: '', appartamenti: '',
                  intervento: '', annoCostruzione: '', tipologiaEdificio: '' },
      pareti: [ blankWall() ],
      pavimenti: [ blankStruct() ],
      solai: [ blankStruct() ],
      coperture: [ blankStruct() ],
      serramenti: [ blankWindow() ],
      generatori: [ blankGen() ],
      impianti: { emissione: '', emissioneAltro: '', regolazioneTipo: [], regolazioneCar: [] },
      rinnovabili: [],
      piani: [],
      firma: { referente: '', qualita: '', qualitaAltro: '', tecnico: '', data: '', img: '', docFronte: '', docRetro: '' }
    };
  }

  const GROUPS = {
    pareti:     { title: 'Pareti', item: 'Parete', make: blankWall },
    pavimenti:  { title: 'Pavimento', item: 'Pavimento', make: blankStruct },
    solai:      { title: 'Solaio interpiano', item: 'Solaio', make: blankStruct },
    coperture:  { title: 'Copertura (o ultimo solaio)', item: 'Copertura', make: blankStruct },
    serramenti: { title: 'Serramenti', item: 'Serramento', make: blankWindow },
    generatori: { title: 'Generatori di calore', item: 'Generatore', make: blankGen },
    rinnovabili:{ title: 'Rinnovabili e altri impianti', item: 'Impianto', make: blankRinn }
  };

  const OPT = {
    isolamento: ['Nessuno', 'Esterno', 'Interno', 'Intercapedine'],
    disperdenza: ["Disperdente verso l'esterno", 'Disperdente verso zona non riscaldata', 'Disperdente verso terreno'],
    confine: ['VERSO ESTERNO', 'VERSO TERRENO', 'VERSO NON RISCALDATO', 'ALTRO'],
    materiale: ['LEGNO', 'PVC', 'ALLUMINIO', 'ALLUMINIO NO TT', 'MISTO', 'ALTRO'],
    vetro: ['SINGOLO', 'DOPPIO', 'TRIPLO', 'BASSO EMISSIVO', 'ALTRO'],
    oscuranti: ['Tapparella', 'Scuri', 'Nessuno'],
    tipologiaGen: ['CALDAIA A CONDENSAZIONE', 'CALDAIA TRADIZIONALE', 'POMPA DI CALORE ARIA-ACQUA', 'POMPA DI CALORE GEOTERMICA', 'GENERATORE A BIOMASSA', 'TELERISCALDAMENTO', 'ALTRO'],
    combustibile: ['METANO', 'GPL', 'GASOLIO', 'LEGNA', 'PELLET', 'ENERGIA ELETTRICA', 'ALTRO'],
    emissione: ['RADIATORI', 'VENTILCONVETTORI', 'PANNELLI RADIANTI', 'ALTRO'],
    regolazioneTipo: ['Di zona', 'Climatica', 'Per singolo ambiente'],
    regolazioneCar: ['Termostato', 'Valvola termostatica', 'Termoregolazione evoluta'],
    intervento: ['Nuova costruzione', 'Passaggio proprietà', 'Locazione', 'Riqualificazione energetica'],
    qualita: ['Proprietario', 'Incaricato alla vendita', 'Referente proprietario', 'Altro'],
    rinnTipo: ['Fotovoltaico', 'Solare termico', 'Stufa a pellet', 'Caminetto', 'Pompa di calore', 'Altro'],
    presente: ['SI', 'NO'],
    ambiente: ['Soggiorno', 'Cucina', 'Camera', 'Bagno', 'Ingresso', 'Corridoio', 'Cantina', 'Locale tecnico', 'Garage', 'Balcone', 'Altro']
  };

  // ================= Archiviazione =================
  function loadAll() {
    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; }
  }
  function saveAll(items) {
    try { localStorage.setItem(KEY, JSON.stringify(items)); return true; }
    catch (e) { return false; }
  }
  function findVisit(id) { return loadAll().find(v => String(v.id) === String(id)); }
  function updateVisit(id, mutator) {
    const items = loadAll();
    const v = items.find(x => String(x.id) === String(id));
    if (!v) return;
    mutator(v);
    if (!saveAll(items)) setStatus('Spazio di archiviazione pieno: alcune modifiche non sono salvate.');
  }

  // IndexedDB per foto e planimetrie (file troppo grandi per localStorage)
  let dbPromise = null;
  function openDb() {
    if (!dbPromise) {
      dbPromise = new Promise((resolve, reject) => {
        const r = indexedDB.open('sopralluoghi-db', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('blobs');
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    }
    return dbPromise;
  }
  function putBlob(id, blob) {
    return openDb().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction('blobs', 'readwrite');
      tx.objectStore('blobs').put(blob, id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    }));
  }
  function getBlob(id) {
    return openDb().then(db => new Promise((resolve, reject) => {
      const q = db.transaction('blobs', 'readonly').objectStore('blobs').get(id);
      q.onsuccess = () => resolve(q.result);
      q.onerror = () => reject(q.error);
    }));
  }
  function delBlob(id) {
    return openDb().then(db => new Promise((resolve) => {
      const tx = db.transaction('blobs', 'readwrite');
      tx.objectStore('blobs').delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    })).catch(() => {});
  }
  function newId(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  // Riduce un'immagine e restituisce un Blob JPEG
  function shrinkBlob(blobOrFile, maxSide, quality) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blobOrFile);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? resolve(b) : reject(new Error('blob')), 'image/jpeg', quality);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
      img.src = url;
    });
  }

  // PDF: prima pagina come immagine (pdf.js caricato solo quando serve)
  let pdfReady = null;
  function loadPdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if (!pdfReady) {
      pdfReady = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = PDFJS;
        s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; resolve(window.pdfjsLib); };
        s.onerror = () => reject(new Error('pdf.js'));
        document.head.appendChild(s);
      });
    }
    return pdfReady;
  }
  function pdfFirstPageBlob(file) {
    return loadPdfJs().then(lib => file.arrayBuffer().then(buf => lib.getDocument({ data: buf }).promise))
      .then(pdf => pdf.getPage(1))
      .then(page => {
        const vp = page.getViewport({ scale: 2 });
        const c = document.createElement('canvas');
        c.width = Math.round(vp.width); c.height = Math.round(vp.height);
        return page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise.then(() =>
          new Promise((resolve, reject) => c.toBlob(b => b ? resolve(b) : reject(new Error('pdf')), 'image/jpeg', 0.85)));
      });
  }

  // ================= UI helpers =================
  const app = document.getElementById('app');
  let tab = 'generali';
  let sel = null; // { piano: index, tag: index }
  let drawMode = null; // indice della planimetria in modalità appunti a mano
  let pendingTap = null; // { pi, x, y } dell'ultimo tocco sulla planimetria
  let inkStroke = null; // tratto in corso
  const zoomOf = {}; // zoom per planimetria (1 = intera)
  const scrollOf = {}; // scorrimento per planimetria

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function setStatus(msg) { const el = document.getElementById('status'); if (el) el.textContent = msg; }
  function currentId() { const m = location.hash.match(/^#\/s\/(\d+)/); return m ? m[1] : null; }

  function field(label, inner) { return '<label class="f">' + esc(label) + inner + '</label>'; }
  function input(attrs, value, type) { return '<input class="t" type="' + (type || 'text') + '" ' + attrs + ' value="' + esc(value) + '">'; }
  function numInput(attrs, value) { return '<input class="t" type="number" inputmode="decimal" min="0" step="any" ' + attrs + ' value="' + esc(value) + '">'; }
  function select(attrs, options, value) {
    let h = '<select class="t" ' + attrs + '><option value="">Scegli…</option>';
    options.forEach(o => { h += '<option value="' + esc(o) + '"' + (o === value ? ' selected' : '') + '>' + esc(o) + '</option>'; });
    return h + '</select>';
  }
  function checks(attrs, options, values) {
    values = values || [];
    return '<div class="chips">' + options.map(o =>
      '<label><input type="checkbox" ' + attrs + ' value="' + esc(o) + '"' + (values.indexOf(o) >= 0 ? ' checked' : '') + '>' + esc(o) + '</label>'
    ).join('') + '</div>';
  }
  function altroField(attrs, value) { return field('Altro (specificare)', input(attrs, value)); }

  // ================= Viste =================
  function renderList() {
    const items = loadAll();
    let h = '<header class="top"><div><div class="sub">Attestati di prestazione energetica</div><h1>Sopralluoghi</h1></div></header>';
    h += '<main>';
    if (!items.length) h += '<div class="empty">Nessun sopralluogo ancora.<br>Tocca “Nuovo sopralluogo” per iniziare.</div>';
    items.forEach(v => {
      h += '<div class="card list" data-open="' + esc(v.id) + '" role="button" tabindex="0">' +
             '<div class="top"><div class="addr">' + esc(v.indirizzo || '[Indirizzo immobile]') + '</div><span class="badge">Bozza</span></div>' +
             '<div class="meta">Creato il ' + esc(new Date(v.creato).toLocaleDateString('it-IT')) + '</div></div>';
    });
    h += '</main>';
    h += '<footer class="bar"><button class="primary" id="openNew" type="button">+ Nuovo sopralluogo</button>' +
         '<div class="note" id="status">Versione di prova · dati salvati sul telefono</div></footer>';
    app.innerHTML = h;
  }

  function renderDetail(id) {
    const v = findVisit(id);
    if (!v) { location.hash = ''; return; }
    v.rinnovabili = v.rinnovabili || [];
    v.piani = v.piani || [];
    let h = '<header class="top"><button class="back" id="back" type="button">‹ Elenco</button>' +
            '<div><div class="sub">Sopralluogo</div><h1>' + esc(v.indirizzo || 'Immobile') + '</h1></div></header>';
    h += '<nav class="tabs">' + TABS.map(t => '<button type="button" data-tab="' + t.id + '"' + (t.id === tab ? ' class="on"' : '') + '>' + t.label + '</button>').join('') + '</nav>';
    if (tab !== 'planimetria') drawMode = null;
    h += '<main>' + tabHtml(v) + '</main>';
    h += '<footer class="bar"><div class="note" id="status">Modifiche salvate automaticamente sul telefono</div></footer>';
    app.innerHTML = h;
    restorePlanScroll();
    const sig = app.querySelector('#sig');
    if (sig) initSignature(sig, v);
    hydrateBlobs();
  }

  function tabHtml(v) {
    switch (tab) {
      case 'generali': return generaliHtml(v);
      case 'involucro': return involucroHtml(v);
      case 'serramenti': return serramentiHtml(v);
      case 'impianti': return impiantiHtml(v);
      case 'rinnovabili': return rinnovabiliHtml(v);
      case 'planimetria': return planimetriaHtml(v);
      default: return firmaHtml(v);
    }
  }

  function generaliHtml(v) {
    const g = v.generali;
    const f = (k) => 'data-g="generali" data-f="' + k + '"';
    return '<div class="sec-title">Proprietario</div><div class="unit">' +
        field('Nome e cognome', input(f('nome'), g.nome)) +
        field('Telefono / e-mail', input(f('telefono'), g.telefono)) +
        field('Codice fiscale / P.IVA', input(f('cf'), g.cf)) +
      '</div>' +
      '<div class="sec-title">Immobile</div><div class="unit">' +
        field('Indirizzo edificio', input(f('indirizzoEdificio'), g.indirizzoEdificio)) +
        '<div class="row2">' + field('Foglio', input(f('foglio'), g.foglio)) + field('Mappale', input(f('mappale'), g.mappale)) + '</div>' +
        field('Subalterno', input(f('sub'), g.sub)) +

  // ---------- Firma ----------
  function initSignature(box, v) {
    const canvas = box.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const r = box.getBoundingClientRect();
    canvas.width = Math.max(1, Math.floor(r.width * dpr));
    canvas.height = Math.max(1, Math.floor(r.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1f2421';
    if (v.firma.img) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, r.width, r.height); img.src = v.firma.img; }
    let drawing = false, last = null, touched = false;
    function pos(e) { const q = canvas.getBoundingClientRect(); return { x: e.clientX - q.left, y: e.clientY - q.top }; }
    canvas.addEventListener('pointerdown', (e) => { drawing = true; last = pos(e); touched = true; canvas.setPointerCapture(e.pointerId); box.querySelector('.hint').style.display = 'none'; });
    canvas.addEventListener('pointermove', (e) => {
      if (!drawing) return;
      const p = pos(e);
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      last = p;
    });
    const end = () => { drawing = false; };
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
    document.getElementById('sigClear').addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      box.querySelector('.hint').style.display = '';
      touched = false;
      updateVisit(v.id, x => { x.firma.img = ''; });
      v.firma.img = '';
      document.getElementById('sigOk').textContent = '';
    });
    document.getElementById('sigSave').addEventListener('click', () => {
      if (!touched && !v.firma.img) { document.getElementById('sigOk').textContent = 'Disegna la firma prima di confermare.'; return; }
      const data = canvas.toDataURL('image/png');
      updateVisit(v.id, x => { x.firma.img = data; });
      v.firma.img = data;
      document.getElementById('sigOk').textContent = 'Firma acquisita.';
    });
  }

  // ================= Modifiche ai dati =================
  function applyChange(target) {
    const id = currentId();
    if (!id) return;
    const g = target.getAttribute('data-g');
    const f = target.getAttribute('data-f');
    if (!g || !f) return;
    const isCheck = target.type === 'checkbox';
    const value = target.value;
    const checked = target.checked;
    updateVisit(id, v => {
      if (g === 'tag') {
        const pi = Number(target.getAttribute('data-pi'));
        const ti = Number(target.getAttribute('data-ti'));
        v.piani[pi].tags[ti][f] = value;
        return;
      }
      if (g === 'piani') {
        v.piani[Number(target.getAttribute('data-i'))][f] = value;
        return;
      }
      const i = target.getAttribute('data-i');
      if (isCheck) {
        const cur = (i != null ? v[g][Number(i)][f] : v[g][f]) || [];
        const out = checked ? cur.concat([value]) : cur.filter(x => x !== value);
        if (i != null) v[g][Number(i)][f] = out; else v[g][f] = out;
      } else if (i != null) {
        v[g][Number(i)][f] = value;
      } else {
        v[g][f] = value;
      }
    });
  }

  // Aggiunge una planimetria (immagine o PDF)
  function uploadPiano(file) {
    const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    setStatus('Caricamento planimetria…');
    const job = isPdf ? pdfFirstPageBlob(file) : shrinkBlob(file, 2000, 0.85);
    job.then(blob => {
      const fileId = newId('p');
      return putBlob(fileId, blob).then(() => {
        updateVisit(currentId(), v => {
          v.piani = v.piani || [];
          v.piani.push({ nome: 'Piano ' + (v.piani.length + 1), fileId: fileId, tags: [] });
        });
        sel = null;
        renderDetail(currentId());
      });
    }).catch(() => setStatus('Impossibile leggere questo file. Prova con un’immagine JPG o PNG.'));
  }

  // Aggiunge foto a un tag
  function addPhotos(pi, ti, files) {
    const list = Array.from(files || []);
    if (!list.length) return;
    setStatus('Salvataggio foto…');
    Promise.all(list.map(f => shrinkBlob(f, 1600, 0.8).then(blob => {
      const id = newId('f');
      return putBlob(id, blob).then(() => id);
    }))).then(ids => {
      updateVisit(currentId(), v => {
        const t = v.piani[pi].tags[ti];
        t.foto = (t.foto || []).concat(ids);
      });
      renderDetail(currentId());
    }).catch(() => setStatus('Foto non salvata. Riprova.'));
  }

  // Aggiunge un tag nel punto toccato
  function addTag(pi, x, y) {
    let newIdx = -1;
    updateVisit(currentId(), v => {
      const p = v.piani[pi];
      p.tags = p.tags || [];
      const n = p.tags.reduce((m, t) => Math.max(m, Number(t.n) || 0), 0) + 1;
      p.tags.push({ n: n, x: x, y: y, ambiente: '', ambienteAltro: '', note: '', foto: [] });
      newIdx = p.tags.length - 1;
    });
    sel = { piano: pi, tag: newIdx };
    renderDetail(currentId());
  }

  const modeSheet = document.getElementById('modeSheet');
  function openModeSheet(pi, x, y) {
    pendingTap = { pi: pi, x: x, y: y };
    modeSheet.classList.add('open');
  }
  function closeModeSheet() { modeSheet.classList.remove('open'); pendingTap = null; }
  document.getElementById('modeTag').addEventListener('click', () => {
    const t = pendingTap; closeModeSheet();
    if (t) addTag(t.pi, t.x, t.y);
  });
  document.getElementById('modeDraw').addEventListener('click', () => {
    const t = pendingTap; closeModeSheet();
    if (t) { drawMode = t.pi; sel = null; renderDetail(currentId()); }
  });
  document.getElementById('modeCancel').addEventListener('click', closeModeSheet);
  modeSheet.addEventListener('click', (e) => { if (e.target === modeSheet) closeModeSheet(); });

  function inkAction(act, pi) {
    if (act === 'done') drawMode = null;
    else updateVisit(currentId(), v => {
      const p = v.piani[pi];
      if (act === 'undo') (p.disegni || []).pop();
      if (act === 'clear') p.disegni = [];
    });
    renderDetail(currentId());
  }

  // Gesti sulla planimetria: due dita insieme = zoom e spostamento; un dito = scrittura (modalità appunti) o scorrimento se ingrandita
  const activePtr = new Map();
  let gesture = null, oneFinger = null, suppressClickUntil = 0;
  function inkPoint(el, e) {
    const r = el.getBoundingClientRect();
    const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    return [+x.toFixed(4), +y.toFixed(4)];
  }
  function updateLine(s) {
    s.line.setAttribute('points', s.pts.map(q => (q[0] * 1000) + ',' + (q[1] * 1000)).join(' '));
  }
  function persistStroke(pi, pts) {
    updateVisit(currentId(), v => {
      const p = v.piani[pi];
      p.disegni = p.disegni || [];
      p.disegni.push({ pts: pts });
    });
  }
  function cancelStroke() {
    if (inkStroke) { inkStroke.line.remove(); inkStroke = null; }
  }
  function startStroke(ov, id, x, y, fromGesture) {
    const svg = ov.querySelector('svg');
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    line.setAttribute('fill', 'none'); line.setAttribute('stroke', '#D32F2F'); line.setAttribute('stroke-width', '3');
    line.setAttribute('vector-effect', 'non-scaling-stroke'); line.setAttribute('stroke-linecap', 'round'); line.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(line);
    inkStroke = { pi: Number(ov.getAttribute('data-ink-draw')), el: ov, line: line, pts: [inkPoint(ov, { clientX: x, clientY: y })], id: id, fromGesture: !!fromGesture };
    try { ov.setPointerCapture(id); } catch (err) { /* il puntatore può non supportare la cattura */ }
    updateLine(inkStroke);
  }
  function restorePlanScroll() {
    app.querySelectorAll('.plan[data-plan]').forEach(pl => {
      const s = scrollOf[Number(pl.getAttribute('data-plan'))];
      if (s) { pl.scrollLeft = s.l; pl.scrollTop = s.t; }
    });
  }
  app.addEventListener('scroll', (e) => {
    const pl = e.target;
    if (pl.classList && pl.classList.contains('plan')) scrollOf[Number(pl.getAttribute('data-plan'))] = { l: pl.scrollLeft, t: pl.scrollTop };
  }, true);

  // Zoom a due dita: il punto della planimetria sotto il centro tra le dita resta fermo mentre le dita si muovono
  function startGesture(plan) {
    const pi = Number(plan.getAttribute('data-plan'));
    const inner = plan.querySelector('.plan-inner');
    const pts = [...activePtr.values()];
    const mx = (pts[0].x + pts[1].x) / 2, my = (pts[0].y + pts[1].y) / 2;
    const ir = inner.getBoundingClientRect();
    gesture = {
      pi: pi, plan: plan, inner: inner,
      dist0: Math.max(1, Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y)),
      z0: zoomOf[pi] || 1,
      fx: (mx - ir.left) / ir.width, fy: (my - ir.top) / ir.height
    };
    suppressClickUntil = Date.now() + 500;
  }
  function moveGesture() {
    const pts = [...activePtr.values()];
    const mx = (pts[0].x + pts[1].x) / 2, my = (pts[0].y + pts[1].y) / 2;
    const dist = Math.max(1, Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y));
    const z = Math.min(4, Math.max(1, gesture.z0 * dist / gesture.dist0));
    const pr = gesture.plan.getBoundingClientRect();
    zoomOf[gesture.pi] = z;
    gesture.inner.style.width = (z * 100) + '%';
    gesture.plan.scrollLeft = gesture.fx * gesture.inner.offsetWidth - (mx - pr.left);
    gesture.plan.scrollTop = gesture.fy * gesture.inner.offsetHeight - (my - pr.top);
  }

  app.addEventListener('pointerdown', (e) => {
    const plan = e.target.closest('.plan[data-plan]');
    if (!plan) return;
    activePtr.set(e.pointerId, { x: e.clientX, y: e.clientY, plan: plan });
    if (activePtr.size >= 2) {
      // Secondo dito: nessun tratto, si passa al gesto di zoom
      cancelStroke();
      oneFinger = null;
      e.preventDefault();
      if (!gesture) startGesture(plan);
      return;
    }
    const ov = e.target.closest('[data-ink-draw]');
    if (ov) {
      e.preventDefault();
      startStroke(ov, e.pointerId, e.clientX, e.clientY, false);
      return;
    }
    oneFinger = { id: e.pointerId, plan: plan, x: e.clientX, y: e.clientY, moved: false };
  });

  app.addEventListener('pointermove', (e) => {
    const cur = activePtr.get(e.pointerId);
    if (cur) { cur.x = e.clientX; cur.y = e.clientY; }
    if (gesture && activePtr.size >= 2) { moveGesture(); return; }
    if (inkStroke && e.pointerId === inkStroke.id) {
      const pt = inkPoint(inkStroke.el, e);
      const last = inkStroke.pts[inkStroke.pts.length - 1];
      if (pt[0] !== last[0] || pt[1] !== last[1]) { inkStroke.pts.push(pt); updateLine(inkStroke); }
      return;
    }
    if (oneFinger && e.pointerId === oneFinger.id) {
      const dx = e.clientX - oneFinger.x, dy = e.clientY - oneFinger.y;
      if (!oneFinger.moved && Math.hypot(e.clientX - oneFinger.x, e.clientY - oneFinger.y) > 8) oneFinger.moved = true;
      const pi = Number(oneFinger.plan.getAttribute('data-plan'));
      if (oneFinger.moved && (zoomOf[pi] || 1) > 1) {
        oneFinger.plan.scrollLeft -= dx;
        oneFinger.plan.scrollTop -= dy;
      }
      oneFinger.x = e.clientX; oneFinger.y = e.clientY;
    }
  });

  function endPointer(e) {
    activePtr.delete(e.pointerId);
    if (gesture) {
      if (activePtr.size < 2) {
        gesture = null;
        suppressClickUntil = Date.now() + 500;
        // Alzato un dito: l'altro scrive (se è attiva la modalità appunti)
        if (activePtr.size === 1) {
          const [id, pos] = [...activePtr.entries()][0];
          const pi = Number(pos.plan.getAttribute('data-plan'));
          const ov = pos.plan.querySelector('[data-ink-draw]');
          if (ov && drawMode === pi) startStroke(ov, id, pos.x, pos.y, true);
        }
      }
      return;
    }
    if (inkStroke && e.pointerId === inkStroke.id) {
      const s = inkStroke; inkStroke = null;
      if (s.fromGesture && s.pts.length === 1) { s.line.remove(); return; }
      const pts = s.pts.length === 1 ? [s.pts[0], s.pts[0]] : s.pts;
      persistStroke(s.pi, pts);
      return;
    }
    if (oneFinger && e.pointerId === oneFinger.id) {
      if (oneFinger.moved) suppressClickUntil = Date.now() + 300;
      oneFinger = null;
    }
  }
  app.addEventListener('pointerup', endPointer);
  app.addEventListener('pointercancel', endPointer);

  // ================= Esportazione PDF =================
  let jspdfReady = null;
  function loadJsPdf() {
    if (window.jspdf) return Promise.resolve(window.jspdf.jsPDF);
    if (!jspdfReady) {
      jspdfReady = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'lib/jspdf.umd.min.js';
        s.onload = () => resolve(window.jspdf.jsPDF);
        s.onerror = () => reject(new Error('jspdf'));
        document.head.appendChild(s);
      });
    }
    return jspdfReady;
  }
  function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }
  function loadImg(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }
  // Planimetria con i tag numerati disegnati sopra
  function planWithTags(dataUrl, tags, disegni) {
    return loadImg(dataUrl).then(img => {
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      // Appunti a mano (colore arancio), sotto ai tag
      (disegni || []).forEach(s => {
        if (!s.pts || !s.pts.length) return;
        ctx.beginPath();
        s.pts.forEach((q, i) => { const X = q[0] * img.width, Y = q[1] * img.height; if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y); });
        ctx.strokeStyle = '#D32F2F'; ctx.lineWidth = Math.max(3, img.width * 0.004);
        ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
      });
      const r = Math.max(14, img.width * 0.018);
      (tags || []).forEach(t => {
        const x = t.x * img.width, y = t.y * img.height;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = '#09405C'; ctx.fill();
        ctx.lineWidth = r * 0.12; ctx.strokeStyle = '#ffffff'; ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold ' + Math.round(r * 1.1) + 'px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(t.n), x, y);
      });
      return { data: c.toDataURL('image/jpeg', 0.85), w: img.width, h: img.height };
    });
  }
  // Ridimensiona un'immagine (lato massimo maxSide) e la restituisce come JPEG in data URL: più leggera per il PDF sul telefono
  function downscaledDataUrl(blob, maxSide) {
    const url = URL.createObjectURL(blob);
    return loadImg(url).then(img => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * k));
      c.height = Math.max(1, Math.round(img.height * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', 0.85);
    }).finally(() => URL.revokeObjectURL(url));
  }
  function blobOrNull(id, maxSide) {
    if (!id) return Promise.resolve(null);
    return getBlob(id).then(b => {
      if (!b) return null;
      return maxSide ? downscaledDataUrl(b, maxSide) : blobToDataUrl(b);
    }).catch(() => null);
  }
  function altro(val, extra) { return val === 'ALTRO' || val === 'Altro' ? ((val) + (extra ? ': ' + extra : ' (non specificato)')) : (val || '-'); }
  function opts(options, chosen) { return options.map(o => ((chosen || []).indexOf(o) >= 0 ? '[X] ' : '[ ] ') + o).join('   '); }
  function dateIt(iso) {
    if (!iso) return '-';
    const p = iso.split('-');
    return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
  }

  function buildPdf(v) {
    return loadJsPdf().then(JsPDF => {
      const doc = new JsPDF({ unit: 'mm', format: 'a4' });
      const M = 12, PW = 210, PH = 297, W = PW - 2 * M, LS = 4.1, PAD = 1.6;
      let y = M;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8.5);

      function need(h) { if (y + h > PH - 14) { doc.addPage(); y = M; } }
      function title(text) {
        need(12);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
        doc.text(text, M, y + 5);
        y += 9;
        doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
      }
      function section(text) {
        need(12); y += 3;
        doc.setFillColor(217, 217, 217);
        doc.rect(M, y, W, 6, 'F');
        doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
        doc.text(text.toUpperCase(), M + 2, y + 4.2);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
        y += 7;
      }
      // cells: [{ t: testo, w: larghezza mm, b: grassetto }]
      function row(cells, header) {
        const wrapped = cells.map(c => doc.splitTextToSize(String(c.t == null || c.t === '' ? '-' : c.t), c.w - 2 * PAD));
        const lines = Math.max(1, ...wrapped.map(l => l.length));
        const h = lines * LS + 2 * PAD;
        need(h);
        let x = M;
        cells.forEach((c, i) => {
          if (header) { doc.setFillColor(240, 239, 233); doc.rect(x, y, c.w, h, 'FD'); }
          else { doc.rect(x, y, c.w, h); }
          doc.setFont('helvetica', (c.b || header) ? 'bold' : 'normal');
          wrapped[i].forEach((ln, k) => doc.text(ln, x + PAD, y + PAD + 3 + k * LS));
          x += c.w;
        });
        doc.setFont('helvetica', 'normal');
        y += h;
      }
      function kv(label, value) { row([{ t: label, w: 56, b: true }, { t: value, w: W - 56 }]); }
      function paragraph(text) {
        const lines = doc.splitTextToSize(text, W);
        need(lines.length * LS + 2);
        lines.forEach(ln => { doc.text(ln, M, y + 3); y += LS; });
        y += 2;
      }

      // ---- Intestazione
      title('SCHEDA RACCOLTA DATI - ATTESTATO DI PRESTAZIONE ENERGETICA');
      doc.setFontSize(8.5);
      doc.text('Immobile: ' + (v.indirizzo || '-') + '     Generato il: ' + new Date().toLocaleDateString('it-IT'), M, y + 3);
      y += 7;

      const g = v.generali, im = v.impianti, fi = v.firma;

      // ---- Proprietario e immobile
      section('Informazioni proprietario');
      kv('Nome e cognome', g.nome);
      kv('Telefono / e-mail', g.telefono);
      kv('Codice fiscale / P.IVA', g.cf);
      section('Informazioni immobile');
      kv('Indirizzo edificio', g.indirizzoEdificio);
      row([{ t: 'Foglio', w: 30, b: true }, { t: g.foglio, w: 33 }, { t: 'Mappale', w: 30, b: true }, { t: g.mappale, w: 33 }, { t: 'Subalterno', w: 30, b: true }, { t: g.sub, w: 30 }]);
      row([{ t: 'Piano abitazione', w: 30, b: true }, { t: g.piano, w: 33 }, { t: 'N° piani abitazione', w: 30, b: true }, { t: g.pianiAbitazione, w: 33 }, { t: 'N° piani edificio', w: 30, b: true }, { t: g.pianiEdificio, w: 30 }]);
      kv('N° appartamenti', g.appartamenti);
      kv('Tipo di intervento', opts(OPT.intervento, g.intervento ? [g.intervento] : []));
      kv('Anno costruzione / ristrutt.', g.annoCostruzione);
      kv('Tipologia edificio', g.tipologiaEdificio);

      // ---- Involucro
      section('Involucro opaco');
      row([{ t: 'Parete', w: 28, b: true }, { t: 'Descrizione', w: 46, b: true }, { t: 'Spessore (cm)', w: 18, b: true }, { t: 'Isolamento', w: 28, b: true }, { t: 'Sp. isolante (cm)', w: 18, b: true }, { t: 'Disperdenza', w: 48, b: true }], true);
      v.pareti.forEach((p, i) => row([
        { t: i === 0 ? 'Parete principale' : 'Parete ' + (i + 1), w: 28, b: true }, { t: p.descrizione, w: 46 }, { t: p.spessore, w: 18 },
        { t: p.isolamento, w: 28 }, { t: p.spessoreIsolante, w: 18 }, { t: p.disperdenza, w: 48 }
      ]));
      const structs = [['Pavimento', v.pavimenti], ['Solaio interpiano', v.solai], ['Copertura', v.coperture]];
      structs.forEach(([nome, list]) => {
        row([{ t: nome, w: 30, b: true }, { t: 'Descrizione', w: 56, b: true }, { t: 'Isolamento', w: 30, b: true }, { t: 'Sp. isolante (cm)', w: 20, b: true }, { t: 'Confine', w: 50, b: true }], true);
        list.forEach((s, i) => row([
          { t: list.length > 1 ? nome + ' ' + (i + 1) : nome, w: 30, b: true }, { t: s.descrizione, w: 56 },
          { t: s.isolamento, w: 30 }, { t: s.spessoreIsolante, w: 20 }, { t: altro(s.confine, s.confineAltro), w: 50 }
        ]));
      });

      // ---- Serramenti
      section('Serramenti');
      row([{ t: 'Serramento', w: 28, b: true }, { t: 'Materiale', w: 60, b: true }, { t: 'Tipo vetro', w: 50, b: true }, { t: 'Tapparelle / Scuri', w: 48, b: true }], true);
      v.serramenti.forEach((s, i) => row([
        { t: 'Serramento ' + (i + 1), w: 28, b: true },
        { t: altro(s.materiale, s.materialeAltro), w: 60 },
        { t: altro(s.vetro, s.vetroAltro), w: 50 },
        { t: opts(OPT.oscuranti, s.oscuranti), w: 48 }
      ]));

      // ---- Impianti
      section('Impianti');
      row([{ t: 'Generatore', w: 26, b: true }, { t: 'Tipologia', w: 66, b: true }, { t: 'Combustibile', w: 40, b: true }, { t: 'Potenza (kW)', w: 27, b: true }, { t: 'Anno', w: 27, b: true }], true);
      v.generatori.forEach((gen, i) => row([
        { t: 'Generatore ' + (i + 1), w: 26, b: true },
        { t: altro(gen.tipologia, gen.tipologiaAltro), w: 66 },
        { t: altro(gen.combustibile, gen.combustibileAltro), w: 40 },
        { t: gen.potenza, w: 27 }, { t: gen.anno, w: 27 }
      ]));
      kv('Impianto di emissione', altro(im.emissione, im.emissioneAltro));
      kv('Tipo di regolazione', opts(OPT.regolazioneTipo, im.regolazioneTipo));
      kv('Caratteristiche regolazione', opts(OPT.regolazioneCar, im.regolazioneCar));

      // ---- Rinnovabili e altri impianti
      section('Fonti rinnovabili e altri impianti');
      if (!v.rinnovabili.length) {
        row([{ t: 'Nessun impianto inserito', w: W }]);
      } else {
        row([{ t: 'Impianto', w: 56, b: true }, { t: 'Presente', w: 24, b: true }, { t: 'Anno', w: 24, b: true }, { t: 'Potenza (kW)', w: 26, b: true }, { t: 'Superficie (m2)', w: 56, b: true }], true);
        v.rinnovabili.forEach(r => row([
          { t: r.tipo === 'Altro' ? (r.tipoAltro || 'Altro') : (r.tipo || '-'), w: 56, b: true },
          { t: r.presente, w: 24 }, { t: r.anno, w: 24 }, { t: r.potenza, w: 26 }, { t: r.superficie, w: 56 }
        ]));
      }

      // ---- Planimetrie con tag
      section('Planimetrie e tag fotografici');
      const planPromises = v.piani.map(p => blobOrNull(p.fileId, 1600).then(d => d ? planWithTags(d, p.tags, p.disegni).catch(() => null) : null));
      return Promise.all(planPromises).then(plans => {
        v.piani.forEach((p, pi) => {
          const pl = plans[pi];
          need(14);
          doc.setFont('helvetica', 'bold'); doc.text(p.nome || ('Planimetria ' + (pi + 1)), M, y + 4); y += 7;
          doc.setFont('helvetica', 'normal');
          if (pl) {
            let wImg = W, hImg = W * pl.h / pl.w;
            const maxH = 150;
            if (hImg > maxH) { hImg = maxH; wImg = maxH * pl.w / pl.h; }
            need(hImg + 4);
            doc.addImage(pl.data, 'JPEG', M + (W - wImg) / 2, y, wImg, hImg);
            y += hImg + 4;
          } else {
            paragraph('Planimetria non disponibile.');
          }
          row([{ t: 'N° tag', w: 16, b: true }, { t: 'Ambiente', w: 56, b: true }, { t: 'Note', w: 80, b: true }, { t: 'Foto', w: 34, b: true }], true);
          (p.tags || []).forEach(t => row([
            { t: t.n, w: 16, b: true }, { t: altro(t.ambiente, t.ambienteAltro), w: 56 }, { t: t.note, w: 80 }, { t: (t.foto || []).length, w: 34 }
          ]));
        });
        // Foto dei tag: griglia 3 per riga
        const photoJobs = [];
        v.piani.forEach(p => (p.tags || []).forEach(t => (t.foto || []).forEach(fid => photoJobs.push({ tag: t, fid }))));
        if (!photoJobs.length) return null;
        section('Fotografie dei tag');
        // Celle verticali 3:4; ogni foto entra nella cella mantenendo il proprio rapporto base/altezza (nessuna deformazione)
        const cols = 3, gap = 4, cw = (W - gap * (cols - 1)) / cols, ch = cw * 4 / 3;
        let col = 0;
        return photoJobs.reduce((chain, job) => chain.then(() => blobOrNull(job.fid, 1200).then(d => {
          if (!d) return;
          if (col === 0) need(ch + 9);
          const x = M + col * (cw + gap);
          return loadImg(d).then(im => {
            const s = Math.min(cw / im.width, ch / im.height);
            const w = im.width * s, h = im.height * s;
            try { doc.addImage(d, 'JPEG', x + (cw - w) / 2, y + (ch - h) / 2, w, h); } catch (e) { console.warn('Foto non inseribile', e); }
          }, () => { console.warn('Foto non leggibile'); }).then(() => {
            doc.setFontSize(7.5);
            doc.text('Tag ' + job.tag.n + ' · ' + altro(job.tag.ambiente, job.tag.ambienteAltro), x, y + ch + 3.5);
            doc.setFontSize(8.5);
            col++;
            if (col === cols) { col = 0; y += ch + 9; }
          });
        })), Promise.resolve()).then(() => { if (col > 0) y += ch + 9; });
      }).then(() => {
        // ---- Conferma e firma
        section('Conferma di sopralluogo');
        kv('Referente', fi.referente);
        kv('In qualità di', altro(fi.qualita, fi.qualitaAltro));
        kv('Tecnico', fi.tecnico);
        kv('Data sopralluogo', dateIt(fi.data));
        y += 2;
        paragraph('Il sottoscritto ' + (fi.referente || '[nome del referente]') + ', in qualità di ' + altro(fi.qualita, fi.qualitaAltro).toLowerCase() +
          ', dichiara che il tecnico ' + (fi.tecnico || '[nome del tecnico]') + " ha effettuato il sopralluogo presso l'immobile sopra descritto in data " + dateIt(fi.data) + '.');
        return Promise.all([fi.docFronte, fi.docRetro, fi.img]).then(([front, back, sig]) => {
          need(60);
          doc.setFont('helvetica', 'bold'); doc.text('Documento di identità del referente (fronte / retro)', M, y + 4); y += 7;
          if (front) doc.addImage(front, 'JPEG', M, y, 80, 52);
          if (back) doc.addImage(back, 'JPEG', M + 88, y, 80, 52);
          y += 56;
          need(45);
          doc.setFont('helvetica', 'bold'); doc.text('Firma del referente', M, y + 4); y += 7;
          doc.rect(M, y, 70, 30);
          if (sig) doc.addImage(sig, 'PNG', M + 1, y + 1, 68, 28);
          y += 34;
        });
      }).then(() => {
        const total = doc.internal.getNumberOfPages();
        for (let i = 1; i <= total; i++) {
          doc.setPage(i);
          doc.setFontSize(7);
          doc.text('Sopralluogo: ' + (v.indirizzo || '') + '  ·  Pagina ' + i + ' di ' + total, M, PH - 6);
        }
        return doc;
      });
    });
  }

  function exportPdf() {
    const id = currentId();
    const v = findVisit(id);
    if (!v) return;
    const btn = document.getElementById('exportPdf');
    if (btn) btn.disabled = true;
    setStatus('Creazione PDF in corso…');
    buildPdf(v).then(doc => {
      const slug = (v.indirizzo || 'immobile').replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_|_$/g, '');
      const name = 'Sopralluogo_' + slug + '_' + new Date().toISOString().slice(0, 10) + '.pdf';
      doc.save(name);
      setStatus('PDF creato: ' + name + ' (cartella Download)');
    }).catch((err) => {
      console.error('Errore PDF:', err);
      setStatus('Impossibile creare il PDF: ' + (err && err.message ? err.message : String(err)));
    }).then(() => { if (btn) btn.disabled = false; });
  }

  // ================= Eventi =================
  app.addEventListener('input', (e) => {
    const t = e.target;
    if (!t.hasAttribute('data-g') || t.type === 'checkbox' || t.type === 'file') return;
    applyChange(t);
  });

  app.addEventListener('change', (e) => {
    const t = e.target;
    if (t.matches('input[type=file][data-doc]')) {
      const file = t.files && t.files[0];
      if (!file) return;
      const key = t.getAttribute('data-doc');
      shrinkBlob(file, 1000, 0.7).then(blob => new Promise(res => {
        const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob);
      })).then(dataUrl => {
        updateVisit(currentId(), v => { v.firma[key] = dataUrl; });
        renderDetail(currentId());
      });
      return;
    }
    if (t.matches('input[type=file][data-upload-piano]')) {
      const file = t.files && t.files[0];
      if (file) uploadPiano(file);
      return;
    }
    if (t.matches('input[type=file][data-photo-pi]')) {
      addPhotos(Number(t.getAttribute('data-photo-pi')), Number(t.getAttribute('data-photo-ti')), t.files);
      return;
    }
    if (t.hasAttribute('data-g') && (t.type === 'checkbox' || t.tagName === 'SELECT' || t.type === 'date')) {
      applyChange(t);
    }
  });

  app.addEventListener('click', (e) => {
    // Tag sul disegno
    const pin = e.target.closest('[data-pin]');
    if (pin) {
      sel = { piano: Number(pin.getAttribute('data-pin')), tag: Number(pin.getAttribute('data-tag')) };
      renderDetail(currentId());
      return;
    }
    const img = e.target.closest('[data-plan-img]');
    if (img) {
      const pi = Number(img.getAttribute('data-plan-img'));
      const rect = img.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      if (Date.now() < suppressClickUntil) return;
      if (x >= 0 && x <= 1 && y >= 0 && y <= 1) openModeSheet(pi, +x.toFixed(4), +y.toFixed(4));
      return;
    }
    const ink = e.target.closest('[data-ink]');
    if (ink) { inkAction(ink.getAttribute('data-ink'), Number(ink.getAttribute('data-pi'))); return; }

    if (e.target.closest('#exportPdf')) { exportPdf(); return; }
    const t = e.target.closest('button, [data-open]');
    if (!t) return;
    if (t.hasAttribute('data-open')) { sel = null; location.hash = '#/s/' + t.getAttribute('data-open'); return; }
    if (t.id === 'openNew') { openSheet(); return; }
    if (t.id === 'back') { sel = null; location.hash = ''; return; }
    if (t.hasAttribute('data-tab')) { tab = t.getAttribute('data-tab'); sel = null; renderDetail(currentId()); return; }
    if (t.hasAttribute('data-add')) {
      const key = t.getAttribute('data-add');
      updateVisit(currentId(), v => { v[key].push(GROUPS[key].make()); });
      renderDetail(currentId());
      return;
    }
    if (t.hasAttribute('data-del')) {
      const key = t.getAttribute('data-del');
      const idx = Number(t.getAttribute('data-i'));
      updateVisit(currentId(), v => { v[key].splice(idx, 1); });
      renderDetail(currentId());
      return;
    }
    if (t.hasAttribute('data-delpiano')) {
      const pi = Number(t.getAttribute('data-delpiano'));
      const v = findVisit(currentId());
      const p = v && v.piani[pi];
      if (p) { delBlob(p.fileId); (p.tags || []).forEach(tg => (tg.foto || []).forEach(delBlob)); }
      updateVisit(currentId(), x => { x.piani.splice(pi, 1); });
      sel = null;
      renderDetail(currentId());
      return;
    }
    if (t.hasAttribute('data-deltag')) {
      const pi = Number(t.getAttribute('data-deltag'));
      const ti = Number(t.getAttribute('data-ti'));
      const v = findVisit(currentId());
      const tg = v && v.piani[pi].tags[ti];
      if (tg) (tg.foto || []).forEach(delBlob);
      updateVisit(currentId(), x => { x.piani[pi].tags.splice(ti, 1); });
      sel = null;
      renderDetail(currentId());
      return;
    }
    if (t.hasAttribute('data-delfoto')) {
      const pi = Number(t.getAttribute('data-pi'));
      const ti = Number(t.getAttribute('data-ti'));
      const fi = Number(t.getAttribute('data-delfoto'));
      const v = findVisit(currentId());
      const fid = v && v.piani[pi].tags[ti].foto[fi];
      if (fid) delBlob(fid);
      updateVisit(currentId(), x => { x.piani[pi].tags[ti].foto.splice(fi, 1); });
      renderDetail(currentId());
      return;
    }
  });

  app.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.matches('[data-open]')) location.hash = '#/s/' + e.target.getAttribute('data-open');
  });

  // ================= Nuovo sopralluogo =================
  const sheet = document.getElementById('sheet');
  function openSheet() {
    document.getElementById('err').textContent = '';
    document.getElementById('addr').value = '';
    sheet.classList.add('open');
    setTimeout(() => document.getElementById('addr').focus(), 50);
  }
  function closeSheet() { sheet.classList.remove('open'); }
  document.getElementById('cancel').addEventListener('click', closeSheet);
  sheet.addEventListener('click', (e) => { if (e.target === sheet) closeSheet(); });
  document.getElementById('newForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const indirizzo = document.getElementById('addr').value.trim();
    if (!indirizzo) { document.getElementById('err').textContent = 'Inserisci l’indirizzo.'; return; }
    const items = loadAll();
    const v = newVisit(indirizzo);
    items.unshift(v);
    if (!saveAll(items)) { document.getElementById('err').textContent = 'Impossibile salvare sul telefono. Riprova.'; return; }
    closeSheet();
    tab = 'generali';
    sel = null;
    location.hash = '#/s/' + v.id;
  });

  window.addEventListener('hashchange', () => { sel = null; refreshDetail(); });
  refreshDetail();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
